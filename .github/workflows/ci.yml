name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A superseded run tells us nothing. Cancel it and keep the queue short.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check internal markdown links
        run: python3 scripts/check-doc-links.py --github

  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Same gate a contributor runs locally before committing: typecheck,
      # lint, format and tests. See CLAUDE.md, "Definition of done".
      - run: npm run verify

      - run: npm run build

      # The build a self-hosted server serves. It only takes a run whose every
      # job went green, so this is uploaded here and judged there - see
      # server/app/.
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          name: kontera-dist
          path: dist/
          retention-days: 30

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Chromium only. The suite emulates a phone viewport rather than running
      # WebKit, so this is a smoke test of behaviour, not of Safari itself -
      # iOS still has to be checked by hand on a device.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
